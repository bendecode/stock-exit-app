<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fb">
    <meta name="description" content="同時追蹤多檔股票的移動停利出場點。">
    <title>股票移動停利清單</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css?v=35">
  </head>
  <body>
    <main class="app-shell">
      <section class="hero" aria-labelledby="appTitle">
        <div>
          <p class="eyebrow">持倉決策台</p>
          <h1 id="appTitle">移動停利監控</h1>
        </div>
        <div class="hero-actions">
          <button class="secondary-action" id="updateAll" type="button">更新全部高點</button>
          <button class="primary-action" id="addStock" type="button" aria-label="新增標的">
            <span aria-hidden="true">+</span>
            新增標的
          </button>
        </div>
      </section>

      <nav class="section-menu" aria-label="主要資訊">
        <a href="#stocksSection">持倉</a>
        <a href="#portfolioSummary">總覽</a>
        <a href="#pnlSection">損益</a>
        <a href="#cloudSection">同步</a>
        <a href="#settingsSection">設定</a>
      </nav>

      <details class="settings-panel" id="settingsSection" aria-label="全域停利設定">
        <summary>
          <span>停利設定</span>
          <strong>啟動獲利率 / 回落獲利比例</strong>
        </summary>
        <div class="settings-fields">
          <label>
            <span>啟動獲利率</span>
            <div class="percent-input">
              <input id="activationPercent" inputmode="decimal" type="number" min="0" step="0.1" value="10">
              <span>%</span>
            </div>
          </label>

          <label>
            <span>回落獲利比例</span>
            <div class="percent-input">
              <input id="pullbackPercent" inputmode="decimal" type="number" min="0" max="100" step="0.1" value="20">
              <span>%</span>
            </div>
          </label>
        </div>
      </details>

      <section class="cloud-panel" id="cloudSection" aria-label="雲端同步設定">
        <div class="cloud-head">
          <div>
            <h2>雲端同步</h2>
            <p id="cloudStatus">尚未連線，資料目前只存在這台裝置。</p>
          </div>
          <div class="cloud-actions">
            <button class="primary-action compact" id="cloudLogin" type="button">登入</button>
            <button class="secondary-action compact" id="cloudSignOut" type="button" hidden>登出</button>
            <button class="secondary-action" id="syncNow" type="button">立即同步</button>
            <details class="cloud-advanced">
              <summary>連線設定</summary>
              <div class="cloud-advanced-grid">
                <label>
                  <span>Supabase URL</span>
                  <input id="supabaseUrl" type="url" placeholder="https://xxxx.supabase.co">
                </label>
                <label>
                  <span>Publishable key</span>
                  <input id="supabaseAnonKey" type="password" autocomplete="off" placeholder="sb_publishable_...">
                </label>
                <button class="secondary-action" id="saveCloudConfig" type="button">儲存設定</button>
              </div>
            </details>
          </div>
        </div>
      </section>

      <div class="login-modal" id="loginModal" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <div class="login-card">
          <div class="login-card-head">
            <div>
              <h2 id="loginTitle">登入雲端同步</h2>
              <p>同一個 Email 可在手機和電腦同步持倉。</p>
            </div>
            <button class="icon-action neutral" id="closeLoginModal" type="button" aria-label="關閉登入視窗">×</button>
          </div>
          <label>
            <span>Email</span>
            <input id="loginEmail" type="email" autocomplete="email" placeholder="you@example.com">
          </label>
          <label id="loginCodeField">
            <span>驗證碼</span>
            <input id="loginCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="驗證碼">
          </label>
          <div class="login-actions">
            <button class="primary-action" id="sendLoginLink" type="button">寄驗證碼</button>
            <button class="secondary-action" id="verifyLoginCode" type="button">驗證登入</button>
          </div>
        </div>
      </div>

      <section class="summary-grid" id="portfolioSummary" aria-live="polite">
        <div class="summary-card alert">
          <span>需要出場</span>
          <strong id="exitCount">0</strong>
        </div>
        <div class="summary-card">
          <span>已啟動持有</span>
          <strong id="holdCount">0</strong>
        </div>
        <div class="summary-card muted">
          <span>尚未啟動</span>
          <strong id="inactiveCount">0</strong>
        </div>
        <div class="summary-card total">
          <span>估算出場獲利</span>
          <strong id="totalProfit">-</strong>
        </div>
      </section>

      <section class="pnl-trend" id="pnlSection" aria-label="每日損益趨勢">
        <div class="trend-head">
          <div>
            <h2>每日損益</h2>
            <p id="pnlTrendMeta">近 30 日</p>
          </div>
          <strong id="pnlTrendValue">-</strong>
        </div>
        <div class="trend-chart">
          <svg id="pnlTrendChart" viewBox="0 0 640 220" role="img" aria-label="每日損益柱狀趨勢圖">
            <g id="pnlTrendGrid"></g>
            <g id="pnlTrendBars"></g>
            <g id="pnlTrendLine"></g>
          </svg>
          <p id="pnlTrendEmpty">有目前價、買進價與股數後開始累積。</p>
        </div>
      </section>

      <section class="stock-list" id="stocksSection" aria-label="股票清單">
        <div class="list-head">
          <h2>持倉監控</h2>
          <p id="listHint">即時監控</p>
        </div>
        <div id="stocks"></div>
      </section>
    </main>

    <template id="stockTemplate">
      <article class="stock-card">
        <button class="position-summary" data-action="toggle-details" type="button" aria-expanded="false">
          <span class="position-symbol" data-output="summarySymbol">新標的</span>
          <span data-output="status">待輸入</span>
          <span>
            <small>股數</small>
            <strong data-output="summaryShares">-</strong>
          </span>
          <span>
            <small>目前價</small>
            <strong data-output="summaryCurrent">-</strong>
          </span>
          <span>
            <small>出場價</small>
            <strong data-output="exitPrice">-</strong>
          </span>
          <span class="summary-cue" aria-hidden="true">詳情</span>
        </button>

        <div class="stock-details" hidden>
          <div class="stock-card-head">
            <label class="symbol-field">
              <span>股票名稱 / 代號</span>
              <input data-field="symbol" type="text" placeholder="輸入代號或名稱">
            </label>
            <button class="icon-action" data-action="remove" type="button" aria-label="刪除標的">×</button>
          </div>

          <div class="stock-inputs">
            <label>
              <span>買進價格</span>
              <input data-field="entry" inputmode="decimal" type="number" min="0" step="0.01">
            </label>
            <label>
              <span>買進日期</span>
              <input data-field="buyDate" type="date">
            </label>
            <label>
              <span>目前價格</span>
              <input data-field="current" inputmode="decimal" type="number" min="0" step="0.01">
            </label>
            <label>
              <span>持有期間最高價</span>
              <input data-field="high" inputmode="decimal" type="number" min="0" step="0.01">
            </label>
            <label>
              <span>股數</span>
              <input data-field="shares" inputmode="numeric" type="number" min="0" step="1">
            </label>
          </div>

          <div class="stock-result">
            <div class="status-row">
              <strong data-output="message">請輸入價格</strong>
            </div>
            <div class="update-row">
              <button class="update-action" data-action="update-high" type="button">更新高點</button>
              <span data-output="updateStatus">使用上市股票代號查詢</span>
            </div>
            <div class="result-grid">
              <div>
                <span>啟動價</span>
                <strong data-output="activationPrice">-</strong>
              </div>
              <div>
                <span>損益%</span>
                <strong data-output="gainPercent">-</strong>
              </div>
              <div>
                <span>距離</span>
                <strong data-output="distance">-</strong>
              </div>
              <div>
                <span>估算獲利</span>
                <strong data-output="profit">-</strong>
              </div>
              <div>
                <span>高點獲利率</span>
                <strong data-output="highGain">-</strong>
              </div>
              <div>
                <span>回落金額</span>
                <strong data-output="pullback">-</strong>
              </div>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=35"></script>
  </body>
</html>
